<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FlatBook - Find Your Perfect Flat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #1a1a2e, #16213e) !important; }
        .navbar-brand { font-weight: 700; }
        .hero { background: linear-gradient(135deg, #0f3460, #16213e); color: white; padding: 70px 0; }
        .flat-card { transition: transform 0.2s, box-shadow 0.2s; border: none; border-radius: 12px; overflow: hidden; }
        .flat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.12); }
        .flat-img { height: 180px; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; color: white; font-size: 3rem; }
        .price { font-size: 1.25rem; font-weight: 700; color: #198754; }
        .footer { background: #1a1a2e; color: #adb5bd; padding: 30px 0; margin-top: 60px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-building"></i> FlatBook</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/flats">Browse Flats</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="/my-bookings">My Bookings</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/admin">Admin Panel</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" href="/login">Login</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link btn btn-outline-light btn-sm ms-2 px-3" href="/register">Register</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Hero -->
<section class="hero text-center">
    <div class="container">
        <h1 class="display-5 fw-bold mb-3">Find Your Perfect Flat</h1>
        <p class="lead mb-4">Search, Book &amp; Pay Online – Simple, Fast &amp; Secure</p>
        <form action="/flats" method="get" class="row g-2 justify-content-center">
            <div class="col-md-3">
                <select name="city" class="form-select form-select-lg">
                    <option value="">All Cities</option>
                    <option th:each="c : ${cities}" th:value="${c}" th:text="${c}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <select name="bhkType" class="form-select form-select-lg">
                    <option value="">Any BHK</option>
                    <option value="1BHK">1 BHK</option>
                    <option value="2BHK">2 BHK</option>
                    <option value="3BHK">3 BHK</option>
                    <option value="4BHK">4 BHK</option>
                    <option value="Studio">Studio</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary btn-lg w-100">
                    <i class="bi bi-search"></i> Search
                </button>
            </div>
        </form>
    </div>
</section>

<!-- Featured Flats -->
<div class="container my-5">
    <h2 class="mb-4">Available Flats</h2>
    <div class="row g-4">
        <div class="col-md-4" th:each="flat : ${flats}">
            <div class="card flat-card h-100 shadow-sm">
                <div class="flat-img">
                    <i class="bi bi-house-door"></i>
                </div>
                <div class="card-body">
                    <span class="badge bg-primary mb-2" th:text="${flat.bhkType}">2BHK</span>
                    <h5 class="card-title" th:text="${flat.title}">Title</h5>
                    <p class="text-muted small mb-1">
                        <i class="bi bi-geo-alt"></i>
                        <span th:text="${flat.locality + ', ' + flat.city}"></span>
                    </p>
                    <p class="small text-muted" th:text="${flat.furnishedStatus}"></p>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="price">₹<span th:text="${#numbers.formatInteger(flat.price, 1, 'COMMA')}"></span>
                            <small class="text-muted fw-normal" th:text="'/' + ${flat.priceType == 'MONTHLY' ? 'mo' : 'sale'}"></small>
                        </span>
                        <a th:href="@{/flats/{id}(id=${flat.id})}" class="btn btn-sm btn-outline-primary">View Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="text-center mt-4" th:if="${#lists.isEmpty(flats)}">
        <p class="text-muted">No flats available at the moment.</p>
    </div>
</div>

<footer class="footer text-center">
    <div class="container">
        <p class="mb-1"><strong>FlatBook</strong> – Online Flat Booking System</p>
        <p class="mb-0 small">Java  Project </p>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
