<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard - FlatBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .sidebar { min-height: 100vh; background: #1a1a2e; }
        .sidebar a { color: #adb5bd; text-decoration: none; display: block; padding: 12px 20px; }
        .sidebar a:hover, .sidebar a.active { background: #0f3460; color: white; }
        .stat-card { border: none; border-radius: 12px; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar p-0">
            <div class="p-3 text-white fw-bold fs-5"><i class="bi bi-building"></i> FlatBook Admin</div>
            <a href="/admin" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="/admin/flats"><i class="bi bi-house"></i> Manage Flats</a>
            <a href="/admin/bookings"><i class="bi bi-calendar-check"></i> Bookings</a>
            <a href="/admin/users"><i class="bi bi-people"></i> Users</a>
            <a href="/"><i class="bi bi-arrow-left"></i> Back to Site</a>
        </div>
        <div class="col-md-10 p-4">
            <h2 class="mb-4">Dashboard</h2>
            <div class="row g-3">
                <div class="col-md-3">
                    <div class="card stat-card shadow-sm text-center p-3">
                        <h3 class="text-primary" th:text="${totalFlats}">0</h3>
                        <p class="mb-0 text-muted">Total Flats</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card shadow-sm text-center p-3">
                        <h3 class="text-success" th:text="${availableFlats}">0</h3>
                        <p class="mb-0 text-muted">Available</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card shadow-sm text-center p-3">
                        <h3 class="text-info" th:text="${confirmedBookings}">0</h3>
                        <p class="mb-0 text-muted">Confirmed Bookings</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card shadow-sm text-center p-3">
                        <h3 class="text-warning" th:text="${totalUsers}">0</h3>
                        <p class="mb-0 text-muted">Registered Users</p>
                    </div>
                </div>
            </div>
            <div class="mt-4">
                <a href="/admin/flats/add" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add New Flat</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
