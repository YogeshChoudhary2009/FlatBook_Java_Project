<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${flat.title} + ' - FlatBook'">Flat Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #1a1a2e, #16213e) !important; }
        .hero-img { height: 320px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 5rem; }
        .price { font-size: 1.8rem; font-weight: 700; color: #198754; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-building"></i> FlatBook</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="/flats">← Back to Flats</a>
        </div>
    </div>
</nav>

<div class="container my-4">
    <div class="row">
        <div class="col-md-7">
            <div class="hero-img mb-3"><i class="bi bi-house-door"></i></div>
            <h2 th:text="${flat.title}"></h2>
            <p class="text-muted"><i class="bi bi-geo-alt"></i>
                <span th:text="${flat.address + ', ' + flat.locality + ', ' + flat.city}"></span>
            </p>
            <p th:text="${flat.description}"></p>
            <h5>Amenities</h5>
            <div>
                <span class="badge bg-secondary me-1 mb-1" th:each="a : ${#strings.arraySplit(flat.amenities, ',')}" th:text="${a}"></span>
            </div>
        </div>
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <span class="badge bg-primary mb-2" th:text="${flat.bhkType}"></span>
                    <span class="badge bg-info mb-2" th:text="${flat.furnishedStatus}"></span>
                    <p class="price">₹<span th:text="${#numbers.formatInteger(flat.price,1,'COMMA')}"></span>
                        <small class="text-muted fs-6" th:text="' / ' + ${flat.priceType == 'MONTHLY' ? 'month' : 'sale'}"></small>
                    </p>
                    <p><strong>Area:</strong> <span th:text="${flat.areaSqft}"></span> sq.ft</p>
                    <p><strong>Status:</strong>
                        <span class="text-success" th:if="${flat.status.name() == 'AVAILABLE'}">Available</span>
                        <span class="text-danger" th:unless="${flat.status.name() == 'AVAILABLE'}" th:text="${flat.status}"></span>
                    </p>
                    <div sec:authorize="isAuthenticated()">
                        <a th:if="${flat.status.name() == 'AVAILABLE'}"
                           th:href="@{/bookings/new/{id}(id=${flat.id})}"
                           class="btn btn-primary btn-lg w-100">
                            <i class="bi bi-calendar-check"></i> Book Now
                        </a>
                    </div>
                    <div sec:authorize="!isAuthenticated()">
                        <a href="/login" class="btn btn-outline-primary w-100">Login to Book</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
