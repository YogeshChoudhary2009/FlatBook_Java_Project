<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment - FlatBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#f8f9fa;}.navbar{background:linear-gradient(135deg,#1a1a2e,#16213e)!important;}</style>
</head>
<body>
<nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="/">FlatBook</a></div></nav>
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white"><h5 class="mb-0">Payment</h5></div>
                <div class="card-body">
                    <p><strong>Booking ID:</strong> <span th:text="${booking.bookingId}"></span></p>
                    <p><strong>Flat:</strong> <span th:text="${booking.flat.title}"></span></p>
                    <p><strong>Amount to Pay:</strong>
                        <span class="fs-4 text-success fw-bold">₹<span th:text="${#numbers.formatInteger(booking.totalAmount,1,'COMMA')}"></span></span>
                    </p>
                    <hr>
                    <form th:action="@{/payment/process}" method="post">
                        <input type="hidden" name="bookingId" th:value="${booking.bookingId}">
                        <div class="mb-3">
                            <label class="form-label">Payment Method</label>
                            <select name="paymentMethod" class="form-select" required>
                                <option value="UPI">UPI</option>
                                <option value="CARD">Credit / Debit Card</option>
                                <option value="NETBANKING">Net Banking</option>
                                <option value="WALLET">Wallet</option>
                                <option value="DEMO">Demo Payment (for testing)</option>
                            </select>
                        </div>
                        <div class="alert alert-info small">
                            This is a demo system. Selecting any method will simulate a successful payment.
                        </div>
                        <button type="submit" class="btn btn-success w-100 btn-lg">Pay Now</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
