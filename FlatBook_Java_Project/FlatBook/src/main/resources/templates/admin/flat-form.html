<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Flat Form - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-4">
    <h2 th:text="${flat.id == null} ? 'Add New Flat' : 'Edit Flat'"></h2>
    <form th:action="@{/admin/flats/save}" th:object="${flat}" method="post" class="card p-4 shadow-sm">
        <input type="hidden" th:field="*{id}">
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label">Title</label>
                <input type="text" th:field="*{title}" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">BHK Type</label>
                <select th:field="*{bhkType}" class="form-select" required>
                    <option value="Studio">Studio</option>
                    <option value="1BHK">1 BHK</option>
                    <option value="2BHK">2 BHK</option>
                    <option value="3BHK">3 BHK</option>
                    <option value="4BHK">4 BHK</option>
                </select>
            </div>
            <div class="col-12">
                <label class="form-label">Description</label>
                <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
            </div>
            <div class="col-md-4">
                <label class="form-label">City</label>
                <input type="text" th:field="*{city}" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Locality</label>
                <input type="text" th:field="*{locality}" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Address</label>
                <input type="text" th:field="*{address}" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label">Area (sq.ft)</label>
                <input type="number" th:field="*{areaSqft}" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label">Price (₹)</label>
                <input type="number" step="0.01" th:field="*{price}" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Furnished Status</label>
                <select th:field="*{furnishedStatus}" class="form-select">
                    <option value="Furnished">Furnished</option>
                    <option value="Semi-Furnished">Semi-Furnished</option>
                    <option value="Unfurnished">Unfurnished</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Status</label>
                <select th:field="*{status}" class="form-select">
                    <option value="AVAILABLE">Available</option>
                    <option value="BOOKED">Booked</option>
                    <option value="UNDER_MAINTENANCE">Under Maintenance</option>
                    <option value="INACTIVE">Inactive</option>
                </select>
            </div>
            <div class="col-12">
                <label class="form-label">Amenities (comma separated)</label>
                <input type="text" th:field="*{amenities}" class="form-control" placeholder="Parking,Lift,Gym,Security">
            </div>
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Save Flat</button>
            <a href="/admin/flats" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
