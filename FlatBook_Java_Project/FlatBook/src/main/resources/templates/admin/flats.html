<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Flats - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#f0f2f5;}.sidebar{min-height:100vh;background:#1a1a2e;}
        .sidebar a{color:#adb5bd;text-decoration:none;display:block;padding:12px 20px;}
        .sidebar a:hover,.sidebar a.active{background:#0f3460;color:white;}
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar p-0">
            <div class="p-3 text-white fw-bold">FlatBook Admin</div>
            <a href="/admin">Dashboard</a>
            <a href="/admin/flats" class="active">Manage Flats</a>
            <a href="/admin/bookings">Bookings</a>
            <a href="/admin/users">Users</a>
            <a href="/">Back to Site</a>
        </div>
        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between mb-3">
                <h2>Manage Flats</h2>
                <a href="/admin/flats/add" class="btn btn-primary">+ Add Flat</a>
            </div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <table class="table table-bordered bg-white shadow-sm">
                <thead class="table-dark">
                <tr><th>ID</th><th>Title</th><th>City</th><th>BHK</th><th>Price</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="f : ${flats}">
                    <td th:text="${f.id}"></td>
                    <td th:text="${f.title}"></td>
                    <td th:text="${f.city}"></td>
                    <td th:text="${f.bhkType}"></td>
                    <td>₹<span th:text="${#numbers.formatInteger(f.price,1,'COMMA')}"></span></td>
                    <td th:text="${f.status}"></td>
                    <td>
                        <a th:href="@{/admin/flats/edit/{id}(id=${f.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                        <form th:action="@{/admin/flats/delete/{id}(id=${f.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this flat?');">
                            <button class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
