<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bookings - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#f0f2f5;}.sidebar{min-height:100vh;background:#1a1a2e;}
        .sidebar a{color:#adb5bd;text-decoration:none;display:block;padding:12px 20px;}
        .sidebar a:hover,.sidebar a.active{background:#0f3460;color:white;}
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar p-0">
            <div class="p-3 text-white fw-bold">FlatBook Admin</div>
            <a href="/admin">Dashboard</a>
            <a href="/admin/flats">Manage Flats</a>
            <a href="/admin/bookings" class="active">Bookings</a>
            <a href="/admin/users">Users</a>
            <a href="/">Back to Site</a>
        </div>
        <div class="col-md-10 p-4">
            <h2 class="mb-3">All Bookings</h2>
            <table class="table table-bordered bg-white shadow-sm">
                <thead class="table-dark">
                <tr><th>Booking ID</th><th>User</th><th>Flat</th><th>City</th><th>Date</th><th>Amount</th><th>Status</th></tr>
                </thead>
                <tbody>
                <tr th:each="b : ${bookings}">
                    <td th:text="${b.bookingId}"></td>
                    <td th:text="${b.user.fullName}"></td>
                    <td th:text="${b.flat.title}"></td>
                    <td th:text="${b.flat.city}"></td>
                    <td th:text="${b.startDate}"></td>
                    <td>₹<span th:text="${#numbers.formatInteger(b.totalAmount,1,'COMMA')}"></span></td>
                    <td><span class="badge bg-secondary" th:text="${b.status}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
