<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Users - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#f0f2f5;}.sidebar{min-height:100vh;background:#1a1a2e;}
        .sidebar a{color:#adb5bd;text-decoration:none;display:block;padding:12px 20px;}
        .sidebar a:hover,.sidebar a.active{background:#0f3460;color:white;}
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar p-0">
            <div class="p-3 text-white fw-bold">FlatBook Admin</div>
            <a href="/admin">Dashboard</a>
            <a href="/admin/flats">Manage Flats</a>
            <a href="/admin/bookings">Bookings</a>
            <a href="/admin/users" class="active">Users</a>
            <a href="/">Back to Site</a>
        </div>
        <div class="col-md-10 p-4">
            <h2 class="mb-3">Registered Users</h2>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <table class="table table-bordered bg-white shadow-sm">
                <thead class="table-dark">
                <tr><th>ID</th><th>Name</th><th>Email</th><th>Mobile</th><th>Role</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.id}"></td>
                    <td th:text="${u.fullName}"></td>
                    <td th:text="${u.email}"></td>
                    <td th:text="${u.mobile}"></td>
                    <td th:text="${u.role}"></td>
                    <td>
                        <span th:class="${u.active} ? 'text-success' : 'text-danger'" th:text="${u.active} ? 'Active' : 'Inactive'"></span>
                    </td>
                    <td>
                        <form th:action="@{/admin/users/toggle/{id}(id=${u.id})}" method="post" class="d-inline">
                            <button class="btn btn-sm btn-outline-warning" th:text="${u.active} ? 'Deactivate' : 'Activate'"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
