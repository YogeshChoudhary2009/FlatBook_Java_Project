# ===============================
# FlatBook - Online Flat Booking System
# ===============================

spring.application.name=FlatBook

# Server
server.port=8080

# ===============================
# Database - H2 (in-memory for easy demo)
# Change to MySQL for production
# ===============================
spring.datasource.url=jdbc:h2:mem:flatbookdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# MySQL Configuration (uncomment to use MySQL)
# ===============================
# spring.datasource.url=jdbc:mysql://localhost:3306/flatbook?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update

# Thymeleaf
spring.thymeleaf.cache=false

# Logging
logging.level.com.flatbook=DEBUG
logging.level.org.springframework.security=INFO
