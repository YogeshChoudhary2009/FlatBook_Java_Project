<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - FlatBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0f3460, #16213e); min-height: 100vh; display: flex; align-items: center; }
        .card { border: none; border-radius: 16px; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg p-4">
                <h3 class="text-center mb-4"><i class="bi bi-building"></i> FlatBook Login</h3>
                <div th:if="${param.error}" class="alert alert-danger">Invalid email or password</div>
                <div th:if="${param.logout}" class="alert alert-success">You have been logged out</div>
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="username" class="form-control" required autofocus placeholder="user@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <p class="text-center mt-3 mb-0">Don't have an account? <a href="/register">Register</a></p>
                <hr>
                <p class="small text-muted mb-0">
                    <strong>Demo Accounts:</strong><br>
                    Admin: admin@flatbook.com / admin123<br>
                    User: user@example.com / user123
                </p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
