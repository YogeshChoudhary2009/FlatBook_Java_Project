<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Booking Confirmed - FlatBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>body{background:#f8f9fa;}.navbar{background:linear-gradient(135deg,#1a1a2e,#16213e)!important;}</style>
</head>
<body>
<nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="/">FlatBook</a></div></nav>
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow text-center">
                <div class="card-body p-5">
                    <i class="bi bi-check-circle-fill text-success" style="font-size:4rem;"></i>
                    <h2 class="mt-3 text-success">Booking Confirmed!</h2>
                    <p class="lead">Your flat has been successfully booked.</p>
                    <hr>
                    <div class="text-start">
                        <p><strong>Booking ID:</strong> <span th:text="${booking.bookingId}"></span></p>
                        <p><strong>Flat:</strong> <span th:text="${booking.flat.title}"></span></p>
                        <p><strong>Location:</strong> <span th:text="${booking.flat.locality + ', ' + booking.flat.city}"></span></p>
                        <p><strong>Start Date:</strong> <span th:text="${booking.startDate}"></span></p>
                        <p><strong>Amount Paid:</strong> ₹<span th:text="${#numbers.formatInteger(booking.totalAmount,1,'COMMA')}"></span></p>
                        <p><strong>Status:</strong> <span class="badge bg-success" th:text="${booking.status}"></span></p>
                    </div>
                    <a href="/my-bookings" class="btn btn-primary mt-3">View My Bookings</a>
                    <a href="/" class="btn btn-outline-secondary mt-3">Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
