<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Bookings - FlatBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#f8f9fa;}.navbar{background:linear-gradient(135deg,#1a1a2e,#16213e)!important;}</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">FlatBook</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="/">Home</a>
            <a class="nav-link text-white" href="/flats">Flats</a>
        </div>
    </div>
</nav>
<div class="container my-4">
    <h2 class="mb-4">My Bookings</h2>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${#lists.isEmpty(bookings)}" class="alert alert-info">You have no bookings yet. <a href="/flats">Browse flats</a></div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(bookings)}">
        <table class="table table-bordered table-hover bg-white shadow-sm">
            <thead class="table-dark">
            <tr>
                <th>Booking ID</th>
                <th>Flat</th>
                <th>City</th>
                <th>Start Date</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${bookings}">
                <td th:text="${b.bookingId}"></td>
                <td th:text="${b.flat.title}"></td>
                <td th:text="${b.flat.city}"></td>
                <td th:text="${b.startDate}"></td>
                <td>₹<span th:text="${#numbers.formatInteger(b.totalAmount,1,'COMMA')}"></span></td>
                <td>
                    <span class="badge" th:classappend="${b.status.name() == 'CONFIRMED' ? 'bg-success' : (b.status.name() == 'CANCELLED' ? 'bg-danger' : 'bg-warning')}"
                          th:text="${b.status}"></span>
                </td>
                <td>
                    <form th:if="${b.status.name() == 'CONFIRMED' or b.status.name() == 'PENDING'}"
                          th:action="@{/bookings/cancel}" method="post" class="d-inline"
                          onsubmit="return confirm('Are you sure you want to cancel this booking?');">
                        <input type="hidden" name="bookingId" th:value="${b.bookingId}">
                        <input type="hidden" name="reason" value="Cancelled by user">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Cancel</button>
                    </form>
                    <span th:unless="${b.status.name() == 'CONFIRMED' or b.status.name() == 'PENDING'}" class="text-muted">—</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
