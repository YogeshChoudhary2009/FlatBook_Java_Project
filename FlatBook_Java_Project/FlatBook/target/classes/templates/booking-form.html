<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Flat - FlatBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#f8f9fa;}.navbar{background:linear-gradient(135deg,#1a1a2e,#16213e)!important;}</style>
</head>
<body>
<nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="/">FlatBook</a></div></nav>
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white"><h5 class="mb-0">Complete Your Booking</h5></div>
                <div class="card-body">
                    <form th:action="@{/bookings/create}" method="post">
                        <input type="hidden" name="flatId" th:value="${flatId}">
                        <div class="mb-3">
                            <label class="form-label">Start Date / Move-in Date</label>
                            <input type="date" name="startDate" class="form-control" required th:attr="min=${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">End Date (optional for monthly rent)</label>
                            <input type="date" name="endDate" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Number of Occupants</label>
                            <input type="number" name="occupants" class="form-control" value="1" min="1" max="10">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Special Requests</label>
                            <textarea name="specialRequests" class="form-control" rows="2"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Proceed to Payment</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
